<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>JSON SERVER CRUD</title>
</head>
<body>
     <div class="container mt-5">
        <div class="mb-4 d-flex justify-content-between">
            <h2 class="text-center">Employee Data</h2>
            <button type="button" class="btn btn-success" id="addEmployeeBtn">
                Add Employee
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Sr No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th class="action-column">Action</th>
                    </tr>
                </thead>
                <tbody id="employeeData">
                    <!-- Employee data will be displayed here -->
                </tbody>
            </table>
        </div>
    </div>
     <div class="employeeEditForm">
        <form id="editEmployeeForm">
            <div class="card">
                <div class="card-header">
                    <h4 id="handing">Add Employee Data</h4>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" class="form-control" id="editName">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" id="editEmail">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select class="form-control" id="editDepartment">
                            <option value="">Select Department</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="IT">IT</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary</label>
                        <input type="number" class="form-control" id="editSalary">
                    </div>
                </div>
                <div class="card-footer">
                    <button type="submit" class="btn btn-primary d-none" id="addBtn">Add Employee</button>
                    <button type="button" class="btn btn-primary d-none" id="updateBtn">Update Employee</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                </div>
            </div>
        </form>
    </div>
     <div class="backdrop" id="backdrop">
    </div>
    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="./node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
